<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="main.css">

</head>
<body>

<div id="header"></div>


<section class="contact-hero d-flex align-items-center justify-content-center text-center text-white">
  <div class="overlay"></div>
  <div class="content position-relative">
    <h1 class="display-3 fw-bold">Contact Us</h1>
    <p class="lead">We would love to hear from you.</p>
  </div>
</section>


<section class="my-5">
  <div class="container">
    <div class="row">


      <div class="col-lg-7 mb-4 mb-lg-0">
        <div class="card shadow border-0 p-4">
          <form action="/submit-contact" method="POST">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" name="fullName" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="subject" name="subject" required>
            </div>
            <div class="mb-4">
              <label for="message" class="form-label">Message</label>
              <textarea rows="5" class="form-control" id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Send Message</button>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card shadow border-0 p-4 h-100">
          <h4 class="fw-bold mb-4">Get In Touch</h4>
          <p>
            <i class="bi bi-envelope-fill me-2"></i>
            support@teetherly.com
          </p>
          <p>
            <i class="bi bi-telephone-fill me-2"></i>
            +1 234 567 890
          </p>
          <p>
            <i class="bi bi-geo-alt-fill me-2"></i>
            25 Baby Street, New York
          </p>
          <hr>
          <h5 class="fw-bold mb-3">Follow Us</h5>
          <div class="d-flex gap-3 fs-3">
            <a href="#" class="text-dark"><i class="bi bi-facebook"></i></a>
            <a href="#" class="text-dark"><i class="bi bi-instagram"></i></a>
            <a href="#" class="text-dark"><i class="bi bi-twitter-x"></i></a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer"></div>

<script src="data.js"></script>
<script src="search.js"></script>
<script src="updatecart.js"></script>
<script src="wishlist.js"></script>
<script src="main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
