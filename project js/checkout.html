<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Teetherly</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="main.css">
</head>

<body>

<div id="header"></div>

<!-- HERO -->
<section class="bg-dark text-white text-center py-5">
  <h1 class="fw-bold">Checkout</h1>
  <p class="text-light">Complete your order securely</p>
</section>

<!-- CHECKOUT SECTION -->
<section class="py-5">
  <div class="container">
    <div class="row g-4">

      <!-- LEFT: BILLING FORM -->
      <div class="col-lg-7">
        <div class="card shadow border-0 p-4">
          <h4 class="fw-bold mb-3">Billing Details</h4>

          <form id="checkoutForm">

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" required>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" required>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">City</label>
                <input type="text" class="form-control" required>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Postal Code</label>
                <input type="text" class="form-control" required>
              </div>
            </div>

            <h5 class="fw-bold mt-3">Payment Method</h5>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment" checked>
              <label class="form-check-label">Cash on Delivery</label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment">
              <label class="form-check-label">Credit Card</label>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="radio" name="payment">
              <label class="form-check-label">PayPal</label>
            </div>

            <button type="submit" class="btn btn-dark w-100 mt-3">
              Place Order
            </button>

          </form>
        </div>
      </div>

        <div class="col-lg-5">
        <div class="card shadow-sm border-0 p-4">
        <h4 class="fw-bold mb-4">Your Order</h4>
        
        <div id="checkoutItems" class="mb-3 border-bottom pb-3">
            </div>

        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Subtotal</span>
            <span id="checkoutSubtotal" class="fw-semibold">$0.00</span>
        </div>

        <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
            <span class="text-muted">Shipping</span>
            <span id="checkoutShipping" class="fw-semibold">$0.00</span>
        </div>

        <div class="d-flex justify-content-between">
            <h5 class="fw-bold">Total</h5>
            <h5 id="checkoutTotal" class="fw-bold text-dark">$0.00</h5>
        </div>
</div>

        <div class="card shadow border-0 p-4">
          <h5 class="fw-bold mb-3">Coupon Code</h5>

          <div class="input-group">
            <input type="text" class="form-control" placeholder="Enter coupon">
            <button class="btn btn-outline-dark">Apply</button>
          </div>

          <small class="text-muted mt-2 d-block">
            Example: SAVE10
          </small>
        </div>

      </div>
    </div>
  </div>
</section>


<script src="data.js"></script>
<script src="cart.js"></script>
<script src="updatecart.js"></script>



<script src="checkout.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
