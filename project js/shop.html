<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="main.css">
<title>Shop - Teetherly</title>

</head>

<body>

<!-- Navbar -->
<div id="header">

</div>

<button id="scrollTopBtn"
class="btn btn-dark position-fixed bottom-0 end-0 m-4 rounded-circle shadow"
style="display:none; z-index:999;">
  <i class="bi bi-arrow-up"></i>
</button>

<!-- Hero -->
<section class="shop-hero d-flex align-items-center">

  <div class="container text-center">

    <h1 class="display-4 fw-bold">
      Shop Our Collection
    </h1>

    <p class="lead">
      Safe, stylish and baby-friendly teething essentials.
    </p>

  </div>

</section>

<!-- Shop Section -->
<section class="container py-5">

  <div class="row g-4">

    <!-- Sidebar -->
    <div class="col-lg-3">

      <div class="filter-box p-4 shadow-sm">

        <h4 class="fw-bold mb-4">
          Filters
        </h4>

        <h6>Categories</h6>

        <div class="form-check">
          <input class="form-check-input" type="checkbox">
          <label class="form-check-label">
            Silicone Teethers
          </label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="checkbox">
          <label class="form-check-label">
            Wooden Toys
          </label>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox">
          <label class="form-check-label">
            Baby Accessories
          </label>
        </div>

        <h6>Price Range</h6>

        <input type="range" class="form-range">

        <button class="btn btn-dark w-100 mt-4">
          Apply Filters
        </button>

      </div>

    </div>

    <!-- Products -->
    <div class="col-lg-9">

      <div class="d-flex justify-content-between align-items-center mb-4">

        <h3 class="fw-bold">
          Featured Products
        </h3>

        <select class="form-select w-auto">
          <option>Sort By</option>
          <option>Newest</option>
          <option>Price Low to High</option>
          <option>Price High to Low</option>
        </select>

      </div>

      <div class="row g-4" id="display">


      </div>
    </div>     



    
</section>

<!-- Footer -->
<div id="footer">

</div>
<script src="data.js"></script>
<script src="search.js"></script>
<script src="updatecart.js"></script>
<script src="wishlist.js"></script>
<script src="filter_sortby.js"></script>  

<script src="main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
